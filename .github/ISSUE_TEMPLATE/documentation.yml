name: Documentation
description: Something in the docs is wrong, unclear, or missing
title: "[Docs]: "
labels: ["documentation", "needs-triage"]
body:
  - type: input
    id: location
    attributes:
      label: Where is the problem?
      description: File name and section, or a link.
      placeholder: docs/USAGE.md, section "Options"
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What kind of problem is it?
      options:
        - Incorrect or outdated information
        - Unclear or confusing
        - Missing information
        - Typo or formatting
        - Accessibility (readability, structure, alt text)
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: What is wrong, and what would you like it to say instead?
    validations:
      required: true
