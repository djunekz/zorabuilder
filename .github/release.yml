changelog:
  exclude:
    labels:
      - skip-changelog
    authors:
      - dependabot
  categories:
    - title: Breaking changes
      labels:
        - breaking
    - title: New features
      labels:
        - enhancement
    - title: Bug fixes
      labels:
        - bug
        - build-failure
    - title: Documentation
      labels:
        - documentation
    - title: Other changes
      labels:
        - "*"
