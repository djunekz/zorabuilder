name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install lint tools
        run: python -m pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check .
      - name: Byte-compile
        run: python -m compileall -q core tests zorabuilder.py

  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: |
          bash -n install.sh
          bash -n uninstall.sh
          bash -n scripts/termux-check.sh
      - name: ShellCheck
        run: shellcheck --severity=warning install.sh uninstall.sh scripts/termux-check.sh
      - name: Install and uninstall smoke test
        run: |
          prefix="$(mktemp -d)"
          ./install.sh --prefix "$prefix" --no-deps
          "$prefix/bin/zorabuilder" --version
          "$prefix/bin/zora" --help > /dev/null
          ./install.sh --prefix "$prefix" --no-deps
          ./uninstall.sh --prefix "$prefix" --yes
          test ! -e "$prefix/bin/zorabuilder"
          test ! -e "$prefix/share/zorabuilder"

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc zlib1g-dev
      - name: Show toolchain
        run: |
          python --version
          gcc --version | head -n 1
          python -c "import sysconfig; print(sysconfig.get_paths()['include']); print(sysconfig.get_config_var('LIBDIR'))"
      - name: Run tests
        run: python -m unittest discover -s tests -t . -v
      - name: Device check
        run: ./scripts/termux-check.sh --skip-tests

  package:
    name: Package install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build and install the wheel
        run: |
          python -m pip install build
          python -m build
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install dist/*.whl
          "$RUNNER_TEMP/venv/bin/zorabuilder" --version
          "$RUNNER_TEMP/venv/bin/zora" --version
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
