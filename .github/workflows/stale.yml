name: Stale

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Mark stale issues and pull requests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/stale@v11
        with:
          days-before-stale: 60
          days-before-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: pinned,security,help wanted,good first issue
          exempt-pr-labels: pinned,security
          only-labels: needs-triage,question
          stale-issue-message: >
            This issue has had no activity for 60 days and will be closed in 14 days
            unless there is new activity. Comment to keep it open.
          stale-pr-message: >
            This pull request has had no activity for 60 days and will be closed in 14 days
            unless there is new activity.
          close-issue-message: Closed because of inactivity. Feel free to reopen with more details.
          close-pr-message: Closed because of inactivity. Feel free to reopen when you are ready to continue.
