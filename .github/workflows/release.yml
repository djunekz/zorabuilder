name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release (for example v2.1.0)
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc zlib1g-dev
      - name: Check that the tag matches the code version
        run: |
          code_version="$(python -c 'from core.cli import VERSION; print(VERSION)')"
          if [ "v${code_version}" != "${TAG}" ]; then
            echo "Tag ${TAG} does not match VERSION v${code_version} in core/cli.py" >&2
            exit 1
          fi
      - name: Run tests
        run: python -m unittest discover -s tests -t . -v
      - name: Extract release notes from CHANGELOG.md
        run: |
          awk -v heading="## [${TAG}]" '
            index($0, heading) == 1 { found = 1; next }
            /^## \[/ { found = 0 }
            found && $0 != "---" { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG.md section found for ${TAG}" >&2
            exit 1
          fi
          cat release-notes.md
      - name: Build distributions
        run: |
          python -m pip install build
          python -m build
          git archive --format=tar.gz --prefix="zorabuilder-${TAG}/" -o "dist/zorabuilder-${TAG}.tar.gz" "${TAG}"
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          body_path: release-notes.md
          files: |
            dist/*
